name: "CI"
on:
  push:
    branches:
      - main
  # Pull request
  pull_request:
    types:
      # Newly opened
      - opened
      # Updated (excludes change of base branch)
      - synchronize
jobs:
  renovate_tasks:
    if: github.actor == 'renovate[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    outputs:
      commit_hash: ${{ steps.get_commit.outputs.COMMIT_HASH }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Required to have correct ref for git-auto-commit-action
          ref: ${{ github.head_ref }}
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelrc: |
            common --color=yes
            common --curses=no
            common --show_progress_rate_limit=5
          cache-save: false
          bazelisk-cache: true
          # Repo cache not worth it here, very little to fetch.
          repository-cache: false
      - run: node ./.github/workflows/update_bazel_nodejs.mjs ./.devcontainer/feature-bazel/install.sh ./MODULE.bazel
      - run: bazel mod deps --lockfile_mode=update
      - uses: stefanzweifel/git-auto-commit-action@v7
      - id: get_commit
        run: echo "COMMIT_HASH=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
  build_and_test:
    runs-on: ubuntu-24.04
    if: ${{ !cancelled() }}
    needs: renovate_tasks
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.renovate_tasks.outputs.commit_hash || github.head_ref }}
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelrc: |
            common --color=yes
            common --curses=no
            common --show_progress_rate_limit=5
            common --lockfile_mode=error
          cache-save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          bazelisk-cache: true
          disk-cache: "${{ github.workflow }}-test"
          repository-cache: |
            - Cargo.lock
            - Cargo.toml
            - MODULE.bazel
            - MODULE.bazel.lock
            - pnpm-lock.yaml
            - maven_install.json
      - run: bazel test //...
        id: test
        continue-on-error: true
      - uses: actions/upload-artifact@v7
        if: steps.test.outcome == 'failure'
        with:
          name: test-logs
          path: .bazel/testlogs/**/test.log
      - run: bazel build //extension/vsix:java_bazel_language_support --stamp
        id: build_vsix
        continue-on-error: true
      - uses: actions/upload-artifact@v7
        if: steps.build_vsix.outcome != 'failure'
        with:
          name: java-bazel-language-support-vsix
          path: .bazel/bin/extension/vsix/java_bazel_language_support.vsix
      - run: exit 1
        if: steps.test.outcome == 'failure' || steps.build_vsix.outcome == 'failure'
  devcontainer:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    if: ${{ !cancelled() }}
    needs: renovate_tasks
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.renovate_tasks.outputs.commit_hash || github.head_ref }}
      - uses: devcontainers/ci@v0.3
        with:
          runCmd: echo "Built successfully"
  dprint:
    runs-on: ubuntu-24.04
    if: ${{ !cancelled() }}
    needs: renovate_tasks
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.renovate_tasks.outputs.commit_hash || github.head_ref }}
      - name: Read tool versions from install.sh
        id: versions
        run: |
          install_sh=./.devcontainer/feature-bazel/install.sh
          dprint_version=$(grep -oP '^DPRINT_VERSION="\K[^"]+' "$install_sh")
          gjf_version=$(grep -oP '^GOOGLE_JAVA_FORMAT_VERSION="\K[^"]+' "$install_sh")
          echo "dprint=$dprint_version" >> "$GITHUB_OUTPUT"
          echo "google_java_format=$gjf_version" >> "$GITHUB_OUTPUT"
      - name: Install google-java-format
        env:
          GOOGLE_JAVA_FORMAT_VERSION: ${{ steps.versions.outputs.google_java_format }}
        run: |
          sudo curl -fsSL \
            "https://github.com/google/google-java-format/releases/download/${GOOGLE_JAVA_FORMAT_VERSION}/google-java-format_linux-x86-64" \
            -o /usr/local/bin/google-java-format
          sudo chmod +x /usr/local/bin/google-java-format
          google-java-format --version
      - uses: dprint/check@v2.3
        with:
          dprint-version: ${{ steps.versions.outputs.dprint }}