name: "CI"
on:
  push:
    branches:
      - main
  # Pull request
  pull_request:
    types:
      # Newly opened
      - opened
      # Updated (excludes change of base branch)
      - synchronize
jobs:
  renovate_tasks:
    if: github.actor == 'renovate[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    outputs:
      commit_hash: ${{ steps.get_commit.outputs.COMMIT_HASH }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Required to have correct ref for git-auto-commit-action
          ref: ${{ github.head_ref }}
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelrc: |
            common --color=yes
            common --curses=no
            common --show_progress_rate_limit=5
          cache-save: false
          bazelisk-cache: true
          # Repo cache not worth it here, very little to fetch.
          repository-cache: false
      - run: node ./.github/workflows/update_bazel_nodejs.mjs ./.devcontainer/feature-bazel/install.sh ./MODULE.bazel
      - run: bazel mod deps --lockfile_mode=update
      - uses: stefanzweifel/git-auto-commit-action@v7
      - id: get_commit
        run: echo "COMMIT_HASH=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
  test:
    runs-on: ubuntu-24.04
    if: ${{ !cancelled() }}
    needs: renovate_tasks
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.renovate_tasks.outputs.commit_hash || github.head_ref }}
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: "${{ github.workflow }}-test"
          repository-cache: true
      - run: bazel test //...
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs
          path: |
            .bazel/testlogs/**/test.log
            .bazel/testlogs/**/test.xml
  build:
    runs-on: ubuntu-24.04
    if: ${{ !cancelled() }}
    needs: renovate_tasks
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.renovate_tasks.outputs.commit_hash || github.head_ref }}
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: "${{ github.workflow }}-build"
          repository-cache: true
      - run: bazel build //extension/vsix:java_bazel_language_support --stamp
      - uses: actions/upload-artifact@v7
        with:
          name: java-bazel-language-support-vsix
          path: .bazel/bin/extension/vsix/java_bazel_language_support.vsix
